<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carta Interactiva con QR</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    #menu-items {
      margin-bottom: 20px;
    }
    #qr-code {
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>Carta del Restaurante</h1>

  <form id="menu-form">
    <div id="menu-items"></div>

    <button type="submit">Generar QR con Comanda</button>
  </form>

  <div id="qr-code"></div>

  <script>
    // Menú de ejemplo
    const menu = [
      { id: 1, name: "Ensalada César", description: "Lechuga, pollo, queso parmesano...", price: 5.99 },
      { id: 2, name: "Pizza Margarita", description: "Tomate, mozzarella, albahaca...", price: 8.99 },
      { id: 3, name: "Hamburguesa Clásica", description: "Carne, queso, lechuga, tomate...", price: 9.99 },
      { id: 4, name: "Sopa de Tomate", description: "Sopa de tomate fresca, con pan tostado.", price: 4.99 },
    ];

    const menuItemsContainer = document.getElementById('menu-items');

    // Mostrar los platos en la página
    menu.forEach(plate => {
      const div = document.createElement('div');
      div.innerHTML = `
        <input type="checkbox" id="plate-${plate.id}" data-id="${plate.id}" />
        <label for="plate-${plate.id}">${plate.name} - ${plate.price}€</label>
        <input type="number" min="1" value="1" id="quantity-${plate.id}" disabled />
        <span>${plate.description}</span>
        <hr />
      `;
      menuItemsContainer.appendChild(div);

      // Habilitar/deshabilitar la cantidad dependiendo del estado del checkbox
      document.getElementById(`plate-${plate.id}`).addEventListener('change', (e) => {
        const quantityInput = document.getElementById(`quantity-${plate.id}`);
        quantityInput.disabled = !e.target.checked;
      });
    });

    // Obtener la comanda seleccionada
    const getComanda = () => {
      const comanda = [];
      document.querySelectorAll('input[type="checkbox"]:checked').forEach(checkbox => {
        const plateId = checkbox.getAttribute('data-id');
        const plate = menu.find(item => item.id == plateId);
        const quantity = document.getElementById(`quantity-${plateId}`).value || 1;
        
        comanda.push({
          plate: plate.name,
          quantity: quantity,
          price: plate.price
        });
      });
      return comanda;
    };

    // Generar el código QR
    const generateQRCode = (comanda) => {
      const qrText = encodeURIComponent(JSON.stringify(comanda));  // Codificar la comanda como JSON
      const qrContainer = document.getElementById('qr-code');
      qrContainer.innerHTML = ''; // Limpiar QR previo
      new QRCode(qrContainer, {
        text: qrText,
        width: 128,
        height: 128
      });
    };

    // Evento para generar QR al enviar el formulario
    document.getElementById('menu-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const comanda = getComanda();
      if (comanda.length > 0) {
        generateQRCode(comanda);
      } else {
        alert('Por favor, selecciona al menos un plato.');
      }
    });
  </script>

</body>
</html>
