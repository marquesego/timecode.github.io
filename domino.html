<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelota con Matter.js</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        #game-container {
            width: 600px;
            height: 400px;
            border: 2px solid black;
            background-color: #ffffff;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.14.4/matter.min.js"></script>
    <script>
        // Crear un motor de Matter.js
        const { Engine, Render, World, Bodies } = Matter;

        // Crear el motor y el mundo
        const engine = Engine.create();
        const world = engine.world;

        // Crear un renderizador
        const render = Render.create({
            element: document.getElementById('game-container'),
            engine: engine,
            options: {
                width: 600,
                height: 400,
                wireframes: false // Usar imágenes realistas
            }
        });

        // Iniciar el motor de renderizado
        Render.run(render);
        Engine.run(engine);

        // Crear el suelo
        const ground = Bodies.rectangle(300, 380, 600, 20, { isStatic: true });
        World.add(world, ground);

        // Crear la pelota (un círculo)
        const ball = Bodies.circle(300, 100, 30, {
            restitution: 0.8, // Rebote alto para que rebote
            render: {
                fillStyle: 'blue' // Color de la pelota
            }
        });
        World.add(world, ball);
    </script>
</body>
</html>
