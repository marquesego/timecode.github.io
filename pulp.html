<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trivial Pulp Fiction 🎬</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #1c1c1c;
      color: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }
    h1 {
      color: #e50914;
    }
    #pregunta {
      font-size: 1.5rem;
      margin: 1rem 0;
      text-align: center;
    }
    .respuestas {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 400px;
      width: 100%;
    }
    .respuestas button {
      background-color: #333;
      color: white;
      border: 1px solid #555;
      padding: 1rem;
      cursor: pointer;
      border-radius: 5px;
      transition: 0.3s;
    }
    .respuestas button:hover {
      background-color: #555;
    }
    #progreso {
      width: 100%;
      height: 10px;
      background: #444;
      margin-top: 1rem;
      border-radius: 5px;
      overflow: hidden;
    }
    #barraTiempo {
      height: 100%;
      background: #e50914;
      width: 100%;
      transition: width 0.1s linear;
    }
    #resultado {
      margin-top: 2rem;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <h1>Trivial Pulp Fiction 🎬</h1>
  <div id="pregunta">Cargando...</div>
  <div class="respuestas" id="respuestas"></div>
  <div id="progreso">
    <div id="barraTiempo"></div>
  </div>
  <div id="resultado"></div>

  <script>
    let preguntas = [];
    let preguntaActual = 0;
    let usadas = [];
    let tiempoTotal = 5; // segundos
    let tiempoRestante;
    let intervalo;

    async function cargarPreguntas() {
      const res = await fetch('pulp_fiction_questions.json');
      preguntas = await res.json();
      usadas = [];
      mostrarPregunta();
    }

    function mostrarPregunta() {
      clearInterval(intervalo);
      if (usadas.length === preguntas.length) {
        document.getElementById("pregunta").textContent = "¡Has respondido todas las preguntas!";
        document.getElementById("respuestas").innerHTML = "";
        document.getElementById("progreso").style.display = "none";
        return;
      }

      let index;
      do {
        index = Math.floor(Math.random() * preguntas.length);
      } while (usadas.includes(index));
      usadas.push(index);

      const q = preguntas[index];
      document.getElementById("pregunta").textContent = q.pregunta;
      const contenedor = document.getElementById("respuestas");
      contenedor.innerHTML = "";
      q.respuestas.forEach(respuesta => {
        const btn = document.createElement("button");
        btn.textContent = respuesta;
        btn.onclick = () => comprobarRespuesta(respuesta, q.correcta);
        contenedor.appendChild(btn);
      });

      iniciarTemporizador();
    }

    function comprobarRespuesta(respuesta, correcta) {
      clearInterval(intervalo);
      if (respuesta === correcta) {
        document.getElementById("resultado").textContent = "✅ ¡Correcto!";
      } else {
        document.getElementById("resultado").textContent = "❌ Incorrecto. Era: " + correcta;
      }
      setTimeout(() => {
        document.getElementById("resultado").textContent = "";
        mostrarPregunta();
      }, 2000);
    }

    function iniciarTemporizador() {
      tiempoRestante = tiempoTotal;
      actualizarBarra();
      intervalo = setInterval(() => {
        tiempoRestante -= 0.1;
        actualizarBarra();
        if (tiempoRestante <= 0) {
          clearInterval(intervalo);
          document.getElementById("resultado").textContent = "⏱️ ¡Tiempo agotado!";
          setTimeout(() => {
            document.getElementById("resultado").textContent = "";
            mostrarPregunta();
          }, 2000);
        }
      }, 100);
    }

    function actualizarBarra() {
      const porcentaje = (tiempoRestante / tiempoTotal) * 100;
      document.getElementById("barraTiempo").style.width = `${porcentaje}%`;
    }

    cargarPreguntas();
  </script>
</body>
</html>
