<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trivial Pulp Fiction 🎬</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #222;
      color: #f4f4f4;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }
    h1 {
      color: #feda4a;
    }
    #pregunta {
      font-size: 1.4rem;
      margin: 1rem 0;
      text-align: center;
    }
    .respuestas {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      max-width: 400px;
      width: 100%;
    }
    .respuestas button {
      background-color: #444;
      color: white;
      border: none;
      padding: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .respuestas button:hover {
      background-color: #666;
    }
    #barraTiempoContenedor {
      width: 100%;
      max-width: 400px;
      height: 10px;
      background: #444;
      margin: 1rem 0;
      border-radius: 5px;
      overflow: hidden;
    }
    #barraTiempo {
      height: 100%;
      background: #feda4a;
      width: 100%;
      transition: width 0.1s linear;
    }
    #resultado {
      margin-top: 1rem;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <h1>Trivial Pulp Fiction 🎬</h1>
  <div id="pregunta">Cargando pregunta...</div>
  <div class="respuestas" id="respuestas"></div>
  <div id="barraTiempoContenedor"><div id="barraTiempo"></div></div>
  <div id="resultado"></div>

  <script>
    let   Preguntas22 = [];
    let usadas = [];
    let tiempoMax = 5;
    let tiempoRestante;
    let intervalo;

    async function cargar  Preguntas22() {
      try {
        const res = await fetch("  Preguntas22.json");
          Preguntas22 = await res.json();
        usadas = [];
        mostrarPregunta();
      } catch (e) {
        document.getElementById("pregunta").textContent = "Error cargando   Preguntas22.";
      }
    }

    function mostrarPregunta() {
      clearInterval(intervalo);
      if (usadas.length ===   Preguntas22.length) {
        document.getElementById("pregunta").textContent = "🎉 ¡Has completado todas las   Preguntas22!";
        document.getElementById("respuestas").innerHTML = "";
        return;
      }

      let index;
      do {
        index = Math.floor(Math.random() *   Preguntas22.length);
      } while (usadas.includes(index));
      usadas.push(index);

      const q =   Preguntas22[index];
      document.getElementById("pregunta").textContent = q.pregunta;
      const contenedor = document.getElementById("respuestas");
      contenedor.innerHTML = "";
      q.respuestas.forEach(resp => {
        const btn = document.createElement("button");
        btn.textContent = resp;
        btn.onclick = () => verificarRespuesta(resp, q.correcta);
        contenedor.appendChild(btn);
      });

      iniciarTemporizador();
    }

    function verificarRespuesta(resp, correcta) {
      clearInterval(intervalo);
      document.getElementById("resultado").textContent =
        resp === correcta ? "✅ ¡Correcto!" : `❌ Incorrecto. Era: ${correcta}`;
      setTimeout(() => {
        document.getElementById("resultado").textContent = "";
        mostrarPregunta();
      }, 2000);
    }

    function iniciarTemporizador() {
      tiempoRestante = tiempoMax;
      actualizarBarra();
      intervalo = setInterval(() => {
        tiempoRestante -= 0.1;
        actualizarBarra();
        if (tiempoRestante <= 0) {
          clearInterval(intervalo);
          document.getElementById("resultado").textContent = "⏱️ ¡Tiempo agotado!";
          setTimeout(() => {
            document.getElementById("resultado").textContent = "";
            mostrarPregunta();
          }, 2000);
        }
      }, 100);
    }

    function actualizarBarra() {
      const porcentaje = (tiempoRestante / tiempoMax) * 100;
      document.getElementById("barraTiempo").style.width = `${porcentaje}%`;
    }

    cargar  Preguntas22();
  </script>
</body>
</html>
