<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trivial Pulp Fiction</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1c1c1c;
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: #2a2a2a;
      padding: 20px;
      border-radius: 8px;
    }

    img {
      max-width: 100%;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .question {
      font-size: 1.3em;
      margin-bottom: 15px;
    }

    .answers button {
      display: block;
      width: 100%;
      margin: 5px 0;
      padding: 10px;
      font-size: 1em;
      background: #444;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .answers button:hover {
      background: #666;
    }

    .progress-bar {
      height: 8px;
      background: red;
      width: 100%;
      margin-bottom: 20px;
      border-radius: 5px;
      animation: progress 5s linear forwards;
    }

    @keyframes progress {
      from { width: 100%; }
      to { width: 0%; }
    }

    .result {
      font-size: 1.2em;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Trivial Pulp Fiction 🎬</h1>
    <div id="game">
      <div class="progress-bar" id="progress"></div>
      <img id="image" src="" alt="" style="display:none;" />
      <div class="question" id="question">Cargando...</div>
      <div class="answers" id="answers"></div>
    </div>
    <div class="result" id="result"></div>
  </div>

  <script>
    let preguntas = [];
    let preguntaActual = 0;
    let score = 0;
    let tiempo;
    let usadas = [];

    function cargarPregunta() {
      clearTimeout(tiempo);
      document.getElementById("progress").style.animation = "none";
      void document.getElementById("progress").offsetWidth; // reinicia animación
      document.getElementById("progress").style.animation = "progress 5s linear forwards";

      if (usadas.length === preguntas.length) {
        document.getElementById("game").style.display = "none";
        document.getElementById("result").innerText = `Juego terminado. Aciertos: ${score}/${preguntas.length}`;
        return;
      }

      let index;
      do {
        index = Math.floor(Math.random() * preguntas.length);
      } while (usadas.includes(index));

      usadas.push(index);
      const pregunta = preguntas[index];
      const contenedorPregunta = document.getElementById("question");
      const contenedorRespuestas = document.getElementById("answers");
      const imagen = document.getElementById("image");

      contenedorPregunta.textContent = pregunta.pregunta;
      imagen.style.display = pregunta.imagen ? 'block' : 'none';
      imagen.src = pregunta.imagen || '';
      contenedorRespuestas.innerHTML = "";

      pregunta.respuestas.forEach(respuesta => {
        const btn = document.createElement("button");
        btn.textContent = respuesta;
        btn.onclick = () => {
          if (respuesta === pregunta.correcta) {
            score++;
          }
          cargarPregunta();
        };
        contenedorRespuestas.appendChild(btn);
      });

      tiempo = setTimeout(() => {
        cargarPregunta();
      }, 5000);
    }

    fetch('pulp_fiction_questions.json')
      .then(res => res.json())
      .then(data => {
        preguntas = data;
        cargarPregunta();
      });
  </script>
</body>
</html>
