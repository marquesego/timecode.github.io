<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Trivial de Cocina</title>
  <style>
    body {
      font-family: sans-serif;
      background: #fff8f0;
      padding: 2rem;
      max-width: 600px;
      margin: auto;
    }
    .question {
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }
    .answers button {
      display: block;
      width: 100%;
      margin: 0.5rem 0;
      padding: 0.5rem;
      font-size: 1rem;
    }
    .timer-container {
      margin-bottom: 1rem;
      width: 100%;
      background-color: #ddd;
      height: 20px;
      border-radius: 10px;
      overflow: hidden;
    }
    .timer-bar {
      height: 100%;
      background-color: #4caf50;
      width: 100%;
      transition: width 1s linear;
    }
  </style>
</head>
<body>
  <h1>Trivial de Cocina</h1>
  <div class="timer-container">
    <div id="timer-bar" class="timer-bar"></div>
  </div>
  <div class="question" id="question">Cargando...</div>
  <div class="answers" id="answers"></div>

  <script>
    let questions = [];
    let currentIndex = 0;
    let time = 5;
    let timerInterval;

    async function loadQuestions() {
      const res = await fetch('preguntas.json');
      questions = await res.json();
      shuffle(questions);
      showQuestion();
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function showQuestion() {
      if (currentIndex >= questions.length) {
        document.getElementById("question").innerText = "¡Juego terminado!";
        document.getElementById("answers").innerHTML = "";
        clearInterval(timerInterval);
        return;
      }

      const q = questions[currentIndex];
      document.getElementById("question").innerText = q.question;
      document.getElementById("answers").innerHTML = "";

      q.answers.forEach((a) => {
        const btn = document.createElement("button");
        btn.innerText = a.text;
        btn.onclick = () => {
          clearInterval(timerInterval);
          if (a.correct) {
            alert("¡Correcto!");
          } else {
            alert("Incorrecto");
          }
          currentIndex++;
          showQuestion();
          startTimer();
        };
        document.getElementById("answers").appendChild(btn);
      });
    }

    function startTimer() {
      time = 5;
      document.getElementById("timer-bar").style.width = "100%"; // Reset the bar
      clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        time--;
        const width = (time / 5) * 100; // Calculate the width based on remaining time
        document.getElementById("timer-bar").style.width = `${width}%`;

        if (time === 0) {
          clearInterval(timerInterval);
          alert("¡Tiempo agotado!");
          currentIndex++;
          showQuestion();
          startTimer();
        }
      }, 1000);
    }

    loadQuestions().then(() => startTimer());
  </script>
</body>
</html>
