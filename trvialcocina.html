<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trivial de Cocina</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fffbe6;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    #question {
      font-size: 20px;
      margin-bottom: 20px;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    button {
      padding: 10px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #e0e0e0;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #d5d5d5;
    }

    .btn.correct {
      background-color: #b6e3b6;
    }

    .btn.wrong {
      background-color: #f7b4b4;
    }

    .hide {
      display: none;
    }

    #score {
      margin-top: 10px;
      font-weight: bold;
    }

    #timer {
      font-size: 18px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Trivial de Cocina</h1>
    <div id="question">Pulsa "Empezar" para jugar</div>
    <div class="btn-grid" id="answer-buttons"></div>
    <button id="next-btn" class="hide">Siguiente</button>
    <button id="start-btn">Empezar</button>
    <div id="score">Puntuación: 0</div>
    <div id="timer">Tiempo: <span id="time">15</span>s</div>
  </div>

  <script>
    const questionContainer = document.getElementById("question");
    const answerButtons = document.getElementById("answer-buttons");
    const nextButton = document.getElementById("next-btn");
    const startButton = document.getElementById("start-btn");
    const scoreElement = document.getElementById("score");
    const timeElement = document.getElementById("time");

    let questions = [];
    let shuffledQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let timerInterval;
    let timeLeft = 15;

    fetch("preguntas.json")
      .then(res => res.json())
      .then(data => {
        questions = data;
      });

    startButton.addEventListener("click", startGame);
    nextButton.addEventListener("click", () => {
      currentQuestionIndex++;
      setNextQuestion();
    });

    function startGame() {
      startButton.classList.add("hide");
      shuffledQuestions = questions.sort(() => Math.random() - 0.5);
      currentQuestionIndex = 0;
      score = 0;
      updateScore();
      setNextQuestion();
    }

    function setNextQuestion() {
      resetState();
      showQuestion(shuffledQuestions[currentQuestionIndex]);
      startTimer();
    }

    function showQuestion(question) {
      questionContainer.innerText = question.question;
      question.answers.forEach(answer => {
        const button = document.createElement("button");
        button.innerText = answer.text;
        button.classList.add("btn");
        if (answer.correct) button.dataset.correct = answer.correct;
        button.addEventListener("click", selectAnswer);
        answerButtons.appendChild(button);
      });
    }

    function resetState() {
      clearInterval(timerInterval);
      nextButton.classList.add("hide");
      answerButtons.innerHTML = "";
    }

    function selectAnswer(e) {
      clearInterval(timerInterval);
      const selectedButton = e.target;
      const correct = selectedButton.dataset.correct === "true";
      setStatusClass(selectedButton, correct);
      Array.from(answerButtons.children).forEach(button => {
        setStatusClass(button, button.dataset.correct === "true");
        button.disabled = true;
      });
      if (correct) score++;
      updateScore();
      if (shuffledQuestions.length > currentQuestionIndex + 1) {
        nextButton.classList.remove("hide");
      } else {
        startButton.innerText = "Volver a jugar";
        startButton.classList.remove("hide");
      }
    }

    function setStatusClass(element, correct) {
      element.classList.remove("correct", "wrong");
      if (correct) {
        element.classList.add("correct");
      } else {
        element.classList.add("wrong");
      }
    }

    function updateScore() {
      scoreElement.innerText = `Puntuación: ${score}`;
    }

    function startTimer() {
      timeLeft = 15;
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          handleTimeout();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      timeElement.innerText = timeLeft;
    }

    function handleTimeout() {
      Array.from(answerButtons.children).forEach(button => {
        const correct = button.dataset.correct === "true";
        setStatusClass(button, correct);
        button.disabled = true;
      });
      nextButton.classList.remove("hide");
    }
  </script>
</body>
</html>
