<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>VFX Editor Pro</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>
<body>
  
  <div class="app-container">
    <header class="app-header">
      <div class="logo">
        <i class="fa-solid fa-video"></i>
        <span>PRO Editor</span>
      </div>
      <div class="header-actions">
         <label for="files" class="btn-import">
           <i class="fa-solid fa-file-import"></i> Importar
         </label>
         <input type="file" id="files" multiple accept="video/*, .mov, .mp4">
      </div>
    </header>

    <main class="app-main">
      <section class="player-section">
        <div class="video-container" id="video-container">
          <video id="video" playsinline preload="auto"></video>
          <div class="video-overlay" id="video-overlay">
            <i class="fa-solid fa-pause pause-icon" style="display:none;"></i>
          </div>
          <div class="timecode-display" id="timecode-display">00:00:00:00</div>
          <div class="clip-duration-display" id="clip-duration-display">Dur: --:--</div>
          <div class="speed-display" id="speed-display">1x</div>
        </div>
        
        <div class="source-scrubber" id="source-scrubber">
          <div class="scrubber-track" id="scrubber-track">
            <div id="markers" class="markers"></div>
            <div class="scrubber-progress" id="scrubber-progress"></div>
            <div class="scrubber-playhead" id="scrubber-playhead"></div>
          </div>
        </div>
        
        <div class="transport-panel">
          <!-- Edit Mode Alert -->
          <div class="edit-mode-panel" id="edit-mode-panel" style="display: none;">
            <div class="edit-mode-label">Reedición (Corte #<span id="edit-cut-num"></span>)</div>
            <button id="btn-cancel-edit" class="btn-tool btn-danger"><i class="fa-solid fa-times"></i> Cancelar</button>
          </div>

          <div class="playback-controls">
            <button id="btn-j" class="icon-btn" title="Reverse (J)"><i class="fa-solid fa-backward"></i></button>
            <button id="btn-step-back" class="icon-btn" title="Step Back 1 Frame"><i class="fa-solid fa-caret-left"></i></button>
            <button id="btn-play-pause" class="icon-btn main-btn" title="Play/Pause (K)"><i class="fa-solid fa-play"></i></button>
            <button id="btn-step-fwd" class="icon-btn" title="Step Fwd 1 Frame"><i class="fa-solid fa-caret-right"></i></button>
            <button id="btn-l" class="icon-btn" title="Forward (L)"><i class="fa-solid fa-forward"></i></button>
          </div>
          
          <div class="mark-controls">
            <button id="btn-mark-in" class="btn-mark">
              <span class="mark-icon">{</span>
              <span class="mark-text">IN <small>(I)</small></span>
            </button>
            <button id="btn-mark-out" class="btn-mark">
              <span class="mark-icon">}</span>
              <span class="mark-text">OUT <small>(O)</small></span>
            </button>
          </div>
        </div>
      </section>

      <section class="workspace-section">
        <div class="tabs">
          <button class="tab active" data-target="bin-view">Media Bin</button>
          <button class="tab" data-target="sequence-view">Secuencia</button>
        </div>

        <div id="bin-view" class="view active">
          <div class="media-bin" id="media-bin">
            <div class="empty-state">No hay archivos. Presiona "Importar" para comenzar.</div>
          </div>
        </div>

        <div id="sequence-view" class="view">
          <div class="sequence-header">
             <div class="seq-info">
               <span class="seq-label">Secuencia Total:</span>
               <span class="seq-time" id="total-seq-time">00:00:00:00</span>
             </div>
             <button id="btn-play-timeline" class="btn-tool"><i class="fa-solid fa-play"></i> Reproducir</button>
          </div>
          <div id="sequence-list" class="cuts-list">
             <div class="empty-state">No hay cortes en la secuencia.</div>
          </div>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <button id="btn-export-xml" class="btn-footer btn-primary">
        <i class="fa-solid fa-file-export"></i> Exportar a Premiere (XML)
      </button>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
