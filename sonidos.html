<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Texto a FX con Grabación</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    textarea { width: 100%; height: 120px; }
    button { margin-top: 10px; }
  </style>
</head>
<body>
  <h1>🎙️ Narrador + FX + Grabación</h1>
  <textarea id="textInput" placeholder="Ej: De pronto, una EXPLOSIÓN sacudió la ciudad..."></textarea><br>
  <button onclick="startPlayback()">▶️ Reproducir + Grabar</button>
  <button onclick="downloadRecording()">💾 Descargar Audio</button>
  <audio id="audioPlayback" controls style="margin-top: 10px; display: none;"></audio>

  <script>
    const soundMap = {
      'EXPLOSIÓN': 'sonidos/explosion.mp3',
      'DISPARO': 'sonidos/disparo.mp3',
      'GRITOS': 'sonidos/gritos.mp3',
      'SIRENA': 'sonidos/sirena.mp3',
      'PASOS': 'sonidos/pasos.mp3',
      'LLUVIA': 'sonidos/lluvia.mp3'
    };

    const synth = window.speechSynthesis;
    const audioCtx = new AudioContext();
    const dest = audioCtx.createMediaStreamDestination();
    const recorder = new MediaRecorder(dest.stream);
    const recordedChunks = [];

    recorder.ondataavailable = e => recordedChunks.push(e.data);
    recorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: 'audio/webm' });
      const audioURL = URL.createObjectURL(blob);
      const audioEl = document.getElementById('audioPlayback');
      audioEl.src = audioURL;
      audioEl.style.display = 'block';
    };

    function speakText(text) {
      return new Promise(resolve => {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'es-ES';

        const source = audioCtx.createMediaStreamSource(dest.stream);
        source.connect(audioCtx.destination);

        utterance.onend = resolve;
        synth.speak(utterance);
      });
    }

    function playFX(word) {
      return new Promise(resolve => {
        const howl = new Howl({
          src: [soundMap[word]],
          onend: resolve
        });

        const sound = howl._sounds[0];
        sound._node.connect(audioCtx.destination);
        sound._node.connect(dest);
        howl.play();
      });
    }

    async function startPlayback() {
      const input = document.getElementById('textInput').value;
      const parts = input.split(/\b(EXPLOSIÓN|DISPARO|GRITOS|SIRENA|PASOS|LLUVIA)\b/);

      recordedChunks.length = 0;
      await audioCtx.resume();
      recorder.start();

      for (const part of parts) {
        const trimmed = part.trim();
        if (soundMap[trimmed]) {
          await playFX(trimmed);
        } else if (trimmed) {
          await speakText(trimmed);
        }
      }

      synth.cancel();
      recorder.stop();
    }

    function downloadRecording() {
      if (!recordedChunks.length) return alert('Aún no hay grabación.');
      const blob = new Blob(recordedChunks, { type: 'audio/webm' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'narracion_fx.webm';
      a.click();
    }
  </script>
</body>
</html>
