<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Texto a Sonidos FX</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
</head>
<body>
  <h1>🔊 Reproduce sonidos desde texto</h1>
  <textarea id="textInput" rows="4" cols="50" placeholder="Ejemplo: explosión, pasos, lluvia..."></textarea><br>
  <button onclick="playFX()">Reproducir sonidos</button>

  <script>
    const soundMap = {
      'explosión': new Howl({ src: ['sonidos/explosion.mp3'] }),
      'pasos':     new Howl({ src: ['sonidos/pasos.mp3'] }),
      'lluvia':    new Howl({ src: ['sonidos/lluvia.mp3'] })
    };

    function playFX() {
      const input = document.getElementById('textInput').value.toLowerCase();
      let found = false;

      Object.keys(soundMap).forEach(word => {
        if (input.includes(word)) {
          soundMap[word].play();
          found = true;
        }
      });

      if (!found) {
        alert('No se encontraron sonidos relacionados.');
      }
    }
  </script>
</body>
</html>
