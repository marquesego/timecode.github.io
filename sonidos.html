<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Editor Podcast Crimen con Efectos y Narración</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      display: flex;
      gap: 20px;
      height: 90vh;
    }
    #editor {
      width: 65%;
      height: 100%;
      font-size: 1.1em;
      padding: 10px;
      border: 1px solid #ccc;
      resize: vertical;
      white-space: pre-wrap;
      font-family: monospace;
      overflow-y: auto;
    }
    #effectsList {
      width: 30%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100%;
    }
    #effectsList h3 {
      margin-bottom: 10px;
    }
    #effectsList button {
      padding: 10px;
      font-weight: bold;
      cursor: pointer;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      transition: background-color 0.3s ease;
      text-align: left;
    }
    #effectsList button:hover {
      background-color: #0056b3;
    }
    #controls {
      margin-top: 20px;
      display: flex;
      gap: 15px;
      justify-content: center;
    }
    #status {
      margin-top: 10px;
      text-align: center;
      font-style: italic;
      color: #555;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
</head>
<body>

  <textarea id="editor" placeholder="Escribe la historia aquí..."></textarea>

  <div id="effectsList">
    <h3>Insertar efectos</h3>
    <button onclick="insertEffect('DISPARO')">DISPARO 🔫</button>
    <button onclick="insertEffect('SUSURROS')">SUSURROS 🤫</button>
    <button onclick="insertEffect('PUERTA-CRUJIDO')">PUERTA CRUJIDO 🚪</button>
    <button onclick="insertEffect('PASOS')">PASOS 👣</button>
    <button onclick="insertEffect('LLUVIA')">LLUVIA 🌧️</button>
    <button onclick="insertEffect('TELÉFONO')">TELÉFONO 📞</button>
    <button onclick="insertEffect('ALARMA')">ALARMA 🚨</button>
    <button onclick="insertEffect('VENTILADOR')">VENTILADOR 🌀</button>
    <button onclick="insertEffect('GRITOS')">GRITOS 😱</button>
    <button onclick="insertEffect('TIEMPO-SILENCIO')">TIEMPO SILENCIO 🕰️</button>
    <button onclick="insertEffect('CORRER')">CORRER 🏃‍♂️</button>
    <button onclick="insertEffect('CERRADURA')">CERRADURA 🔐</button>
    <button onclick="insertEffect('POLICÍA')">POLICÍA 🚓</button>

    <div id="controls">
      <button onclick="playNarration()">▶️ Reproducir narración + efectos</button>
      <button onclick="stopNarration()">⏹️ Parar</button>
    </div>
    <div id="status"></div>
  </div>

  <script>
    // Mapear efectos a sonidos (pon tus archivos en carpeta sonidos)
    const soundMap = {
      'DISPARO':       new Howl({ src: ['sonidos/disparo.mp3'] }),
      'SUSURROS':      new Howl({ src: ['sonidos/susurros.mp3'] }),
      'PUERTA-CRUJIDO':new Howl({ src: ['sonidos/puerta-crujido.mp3'] }),
      'PASOS':         new Howl({ src: ['sonidos/pasos.mp3'] }),
      'LLUVIA':        new Howl({ src: ['sonidos/lluvia.mp3'] }),
      'TELÉFONO':      new Howl({ src: ['sonidos/telefono.mp3'] }),
      'ALARMA':        new Howl({ src: ['sonidos/alarma.mp3'] }),
      'VENTILADOR':    new Howl({ src: ['sonidos/ventilador.mp3'] }),
      'GRITOS':        new Howl({ src: ['sonidos/gritos.mp3'] }),
      'TIEMPO-SILENCIO': new Howl({ src: ['sonidos/tiempo-silencio.mp3'] }),
      'CORRER':        new Howl({ src: ['sonidos/correr.mp3'] }),
      'CERRADURA':     new Howl({ src: ['sonidos/cerradura.mp3'] }),
      'POLICÍA':       new Howl({ src: ['sonidos/policia.mp3'] })
    };

    // Insertar efecto en el texto
    function insertEffect(effect) {
      const editor = document.getElementById('editor');
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      const text = editor.value;
      editor.value = text.slice(0, start) + ' ' + effect + ' ' + text.slice(end);
      editor.selectionStart = editor.selectionEnd = start + effect.length + 2;
      editor.focus();
    }

    let synth = window.speechSynthesis;
    let utterance = null;
    let isPlaying = false;
    let startTime = 0;
    let scheduledSounds = [];

    function playNarration() {
      if (!synth) {
        alert("Este navegador no soporta síntesis de voz.");
        return;
      }
      if (isPlaying) {
        stopNarration();
      }

      const text = document.getElementById('editor').value;
      if (!text.trim()) {
        alert("Escribe algún texto para narrar.");
        return;
      }

      document.getElementById('status').textContent = "Narrando...";
      isPlaying = true;

      // Dividir texto en palabras para calcular tiempos aproximados
      const words = text.split(/\s+/);

      // Suponemos duración media por palabra en ms
      const avgWordDuration = 350; // 0.35 seg por palabra, ajustable

      // Detectar efectos (mayúsculas completas, guiones y sin tildes)
      // Buscamos las palabras que coincidan exactamente con los efectos de soundMap
      let effectPositions = [];
      let indexChar = 0;
      words.forEach((word, i) => {
        let cleanWord = word.toUpperCase().replace(/[.,;:!?]/g, '').normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        if (soundMap[cleanWord]) {
          effectPositions.push({
            effect: cleanWord,
            // tiempo aproximado en ms desde inicio (palabra índice * avgWordDuration)
            time: i * avgWordDuration
          });
        }
        // Actualizar indexChar para avanzar (palabra + espacio)
        indexChar += word.length + 1;
      });

      // Crear utterance para narrar todo el texto
      utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'es-ES';
      utterance.rate = 1; // velocidad de voz
      utterance.pitch = 1;

      // Al iniciar la voz, guardamos la hora y programamos los sonidos
      utterance.onstart = () => {
        startTime = performance.now();
        // Programar cada efecto con setTimeout según el tiempo estimado
        scheduledSounds = effectPositions.map(({effect, time}) => {
          return setTimeout(() => {
            if (soundMap[effect]) {
              soundMap[effect].play();
            }
          }, time);
        });
      };

      // Cuando termine, limpiamos y actualizamos estado
      utterance.onend = () => {
        scheduledSounds.forEach(timeoutId => clearTimeout(timeoutId));
        scheduledSounds = [];
        isPlaying = false;
        document.getElementById('status').textContent = "Narración finalizada.";
      };

      synth.speak(utterance);
    }

    function stopNarration() {
      if (isPlaying) {
        synth.cancel();
        scheduledSounds.forEach(timeoutId => clearTimeout(timeoutId));
        scheduledSounds = [];
        isPlaying = false;
        document.getElementById('status').textContent = "Narración detenida.";
      }
    }

  </script>

</body>
</html>
