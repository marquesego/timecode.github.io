<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sonido FX (funciona)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
</head>
<body>
  <h1>🔊 Prueba de sonido desde GitHub Pages</h1>
  <button onclick="playSound()">Reproducir explosión</button>

  <script>
    const explosion = new Howl({
      src: ['https://cdn.pixabay.com/download/audio/2022/03/15/audio_cdd7f71c64.mp3?filename=explosion-6055.mp3'],
      volume: 1
    });

    function playSound() {
      explosion.play();
    }
  </script>
</body>
</html>
