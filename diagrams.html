<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagram Editor</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #toolbar {
      background: #333;
      color: white;
      padding: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    #container {
      width: 100vw;
      height: calc(100vh - 50px);
    }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <div id="toolbar">
    <button onclick="addBox()">Añadir Caja</button>
    <button onclick="exportDiagram()">Exportar</button>
    <input type="file" onchange="importDiagram(event)" />
  </div>
  <div id="container"></div>

  <script src="https://cdn.jsdelivr.net/npm/konva@9.2.0/konva.min.js"></script>
  <script>
    const width = window.innerWidth;
    const height = window.innerHeight - 50;

    const stage = new Konva.Stage({ container: 'container', width, height, draggable: true });
    const layer = new Konva.Layer();
    stage.add(layer);

    let boxes = [];
    let arrows = [];
    let selectedBox = null;
    let connecting = false;
    let connectFrom = null;

    function addBox() {
      const group = new Konva.Group({ x: 50, y: 50, draggable: true });

      const rect = new Konva.Rect({ width: 120, height: 50, fill: '#89b717', cornerRadius: 5, shadowBlur: 5 });
      const text = new Konva.Text({ text: 'Nueva caja', fontSize: 16, fill: 'white', padding: 10 });
      const box = { group, rect, text };

      group.add(rect);
      group.add(text);
      layer.add(group);

      group.on('dblclick', () => {
        const name = prompt('Nuevo nombre:', text.text());
        if (name) text.text(name);
      });

      group.on('dragmove', updateArrows);

      group.on('click', () => {
        if (connecting && connectFrom && connectFrom !== group) {
          createArrow(connectFrom, group);
          connecting = false;
          connectFrom = null;
        } else {
          connectFrom = group;
          connecting = true;
        }
      });

      boxes.push(box);
      layer.draw();
    }

    function getConnectorPoints(from, to) {
      const fBox = from.getClientRect();
      const tBox = to.getClientRect();

      const fx = fBox.x + fBox.width / 2;
      const fy = fBox.y + fBox.height / 2;
      const tx = tBox.x + tBox.width / 2;
      const ty = tBox.y + tBox.height / 2;

      const dx = tx - fx;
      const dy = ty - fy;

      let fromPoint, toPoint;

      if (Math.abs(dx) > Math.abs(dy)) {
        fromPoint = [dx > 0 ? fBox.x + fBox.width : fBox.x, fy];
        toPoint = [dx > 0 ? tBox.x : tBox.x + tBox.width, ty];
      } else {
        fromPoint = [fx, dy > 0 ? fBox.y + fBox.height : fBox.y];
        toPoint = [tx, dy > 0 ? tBox.y : tBox.y + tBox.height];
      }

      return [...fromPoint, ...toPoint];
    }

    function createArrow(from, to) {
      const points = getConnectorPoints(from, to);
      const arrow = new Konva.Arrow({
        points,
        pointerLength: 10,
        pointerWidth: 10,
        fill: 'black',
        stroke: 'black',
        strokeWidth: 2,
      });
      arrow.from = from;
      arrow.to = to;
      arrows.push(arrow);
      layer.add(arrow);
      layer.draw();
    }

    function updateArrows() {
      arrows.forEach(arrow => {
        arrow.points(getConnectorPoints(arrow.from, arrow.to));
      });
      layer.batchDraw();
    }

    function exportDiagram() {
      const data = {
        boxes: boxes.map(b => ({
          x: b.group.x(),
          y: b.group.y(),
          text: b.text.text()
        })),
        arrows: arrows.map(a => ({
          from: boxes.indexOf(boxes.find(b => b.group === a.from)),
          to: boxes.indexOf(boxes.find(b => b.group === a.to))
        }))
      };
      const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'diagram.json';
      a.click();
    }

    function importDiagram(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const data = JSON.parse(reader.result);
        boxes.forEach(b => b.group.destroy());
        arrows.forEach(a => a.destroy());
        boxes = [];
        arrows = [];

        data.boxes.forEach(b => {
          const group = new Konva.Group({ x: b.x, y: b.y, draggable: true });
          const rect = new Konva.Rect({ width: 120, height: 50, fill: '#89b717', cornerRadius: 5, shadowBlur: 5 });
          const text = new Konva.Text({ text: b.text, fontSize: 16, fill: 'white', padding: 10 });
          group.add(rect);
          group.add(text);
          layer.add(group);

          group.on('dblclick', () => {
            const name = prompt('Nuevo nombre:', text.text());
            if (name) text.text(name);
          });

          group.on('dragmove', updateArrows);
          group.on('click', () => {
            if (connecting && connectFrom && connectFrom !== group) {
              createArrow(connectFrom, group);
              connecting = false;
              connectFrom = null;
            } else {
              connectFrom = group;
              connecting = true;
            }
          });

          boxes.push({ group, rect, text });
        });

        data.arrows.forEach(a => {
          createArrow(boxes[a.from].group, boxes[a.to].group);
        });
      };
      reader.readAsText(file);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Delete' && selectedBox) {
        arrows = arrows.filter(a => {
          if (a.from === selectedBox || a.to === selectedBox) {
            a.destroy();
            return false;
          }
          return true;
        });
        selectedBox.destroy();
        boxes = boxes.filter(b => b.group !== selectedBox);
        selectedBox = null;
        layer.draw();
      }
    });
  </script>
</body>
</html>
