<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editor de Diagramas</title>
  <script src="https://unpkg.com/konva@9/konva.min.js"></script>
  <style>
    body { margin: 20px; font-family: sans-serif; }
    #container { border: 1px solid #ccc; width: 100%; height: 600px; }
    button, input[type=file] { margin: 5px; }
  </style>
</head>
<body>
  <h1>Editor de Diagramas</h1>
  <button onclick="addBox()">Añadir Caja</button>
  <button onclick="exportJSON()">Exportar JSON</button>
  <input type="file" accept=".json" onchange="importJSON(event)" />
  <div id="container"></div>

  <script>
    const width = window.innerWidth - 40;
    const height = 600;

    const stage = new Konva.Stage({ container: 'container', width, height });
    const layer = new Konva.Layer();
    const connectionLayer = new Konva.Layer();
    stage.add(connectionLayer);
    stage.add(layer);

    const connections = [];
    let selectedBox = null;

    function addBox(x = 50, y = 50, text = 'Caja') {
      const group = new Konva.Group({ x, y, draggable: true });

      const rect = new Konva.Rect({
        width: 120,
        height: 50,
        fill: '#89b717',
        stroke: 'black',
        strokeWidth: 2,
        cornerRadius: 8
      });

      const label = new Konva.Text({
        text,
        fontSize: 16,
        fill: 'white',
        align: 'center',
        verticalAlign: 'middle',
        width: 120,
        height: 50,
        padding: 10
      });

      group.add(rect);
      group.add(label);
      layer.add(group);

      group.on('dblclick', () => {
        const newText = prompt('Nuevo texto para la caja:', label.text());
        if (newText !== null) {
          label.text(newText);
          layer.draw();
        }
      });

      group.on('click', () => {
        if (!selectedBox) {
          selectedBox = group;
        } else if (selectedBox !== group) {
          createConnection(selectedBox, group);
          selectedBox = null;
        } else {
          selectedBox = null;
        }
      });

      group.on('dragmove', () => {
        updateConnections();
      });

      layer.draw();
    }

    function createConnection(fromGroup, toGroup) {
      const line = new Konva.Arrow({
        points: getConnectionPoints(fromGroup, toGroup),
        pointerLength: 10,
        pointerWidth: 10,
        fill: 'black',
        stroke: 'black',
        strokeWidth: 2
      });
      connectionLayer.add(line);
      connections.push({ from: fromGroup, to: toGroup, line });
      connectionLayer.draw();
    }

    function getConnectionPoints(fromGroup, toGroup) {
      const startX = fromGroup.x() + 60;
      const startY = fromGroup.y() + 25;
      const endX = toGroup.x() + 60;
      const endY = toGroup.y() + 25;
      return [startX, startY, endX, endY];
    }

    function updateConnections() {
      connections.forEach(conn => {
        conn.line.points(getConnectionPoints(conn.from, conn.to));
      });
      connectionLayer.batchDraw();
    }

    function exportJSON() {
      const boxes = [];
      layer.getChildren().forEach(group => {
        const [rect, text] = group.getChildren();
        boxes.push({
          x: group.x(),
          y: group.y(),
          text: text.text()
        });
      });
      const blob = new Blob([JSON.stringify(boxes, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'diagrama.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          layer.destroyChildren();
          connectionLayer.destroyChildren();
          connections.length = 0;
          data.forEach(item => addBox(item.x, item.y, item.text));
          layer.draw();
        } catch (e) {
          alert('Error al importar JSON. Asegúrate de que el archivo tenga el formato correcto.');
          console.error(e);
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
