<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Editor de Diagramas Avanzado</title>
  <script src="https://unpkg.com/konva@9/konva.min.js"></script>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    #container { border: 1px solid #ccc; width: 100%; height: 600px; }
    button, input { margin: 5px; }
  </style>
</head>
<body>
  <h1>Editor de Diagramas Avanzado</h1>
  <button onclick="addNode()">➕ Añadir caja</button>
  <button onclick="startConnecting()">🔗 Conectar cajas</button>
  <button onclick="exportDiagram()">💾 Exportar JSON</button>
  <input type="file" onchange="importDiagram(event)" />
  <div id="container"></div>

  <script>
    const width = window.innerWidth - 40;
    const height = 600;

    const stage = new Konva.Stage({ container: 'container', width, height });
    const layer = new Konva.Layer();
    stage.add(layer);

    const arrows = [];
    const nodes = [];
    let connectMode = false;
    let fromNode = null;

    function addNode(x = 100, y = 100, text = 'Caja') {
      const group = new Konva.Group({ x, y, draggable: true });

      const rect = new Konva.Rect({
        width: 120,
        height: 50,
        fill: '#3498db',
        stroke: 'black',
        strokeWidth: 2,
        cornerRadius: 6
      });

      const label = new Konva.Text({
        text,
        fontSize: 16,
        fill: 'white',
        align: 'center',
        verticalAlign: 'middle',
        width: 120,
        height: 50,
        padding: 10
      });

      group.add(rect);
      group.add(label);
      layer.add(group);
      nodes.push(group);

      group.on('dblclick', () => {
        const newText = prompt('Nuevo texto:', label.text());
        if (newText) {
          label.text(newText);
          layer.draw();
        }
      });

      group.on('dragmove', updateArrows);

      group.on('click', () => {
        if (connectMode) {
          if (!fromNode) {
            fromNode = group;
            highlight(group, true);
          } else {
            if (fromNode !== group) {
              drawArrow(fromNode, group);
            }
            highlight(fromNode, false);
            fromNode = null;
            connectMode = false;
          }
        }
      });

      layer.draw();
    }

    function highlight(group, state) {
      const rect = group.findOne('Rect');
      rect.stroke(state ? 'red' : 'black');
      layer.draw();
    }

    function startConnecting() {
      connectMode = true;
      fromNode = null;
    }

    function drawArrow(from, to) {
      const arrow = new Konva.Arrow({
        points: getPoints(from, to),
        stroke: 'black',
        fill: 'black',
        pointerLength: 10,
        pointerWidth: 10
      });
      arrow.from = from;
      arrow.to = to;
      arrows.push(arrow);
      layer.add(arrow);
      layer.draw();
    }

    function getPoints(from, to) {
      const fromBox = from.getClientRect();
      const toBox = to.getClientRect();
      return [
        fromBox.x + fromBox.width / 2,
        fromBox.y + fromBox.height / 2,
        toBox.x + toBox.width / 2,
        toBox.y + toBox.height / 2
      ];
    }

    function updateArrows() {
      arrows.forEach(arrow => {
        arrow.points(getPoints(arrow.from, arrow.to));
      });
      layer.batchDraw();
    }

    function exportDiagram() {
      const data = {
        nodes: nodes.map(n => {
          const text = n.findOne('Text').text();
          return { x: n.x(), y: n.y(), text };
        }),
        links: arrows.map(a => ({
          from: nodes.indexOf(a.from),
          to: nodes.indexOf(a.to)
        }))
      };

      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'diagrama.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function importDiagram(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          layer.destroyChildren();
          arrows.length = 0;
          nodes.length = 0;

          data.nodes.forEach(n => addNode(n.x, n.y, n.text));
          data.links.forEach(link => drawArrow(nodes[link.from], nodes[link.to]));

        } catch (e) {
          alert('Error al importar: JSON inválido.');
          console.error(e);
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
