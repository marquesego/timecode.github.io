<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editor de Diagramas</title>
  <script src="https://unpkg.com/konva@9/konva.min.js"></script>
  <style>
    body { margin: 20px; font-family: sans-serif; }
    #container { border: 1px solid #ccc; width: 100%; height: 600px; }
    button, input[type=file] { margin: 5px; }
  </style>
</head>
<body>
  <h1>Editor de Diagramas</h1>
  <button onclick="addBox()">Añadir Caja</button>
  <button onclick="exportJSON()">Exportar JSON</button>
  <input type="file" accept=".json" onchange="importJSON(event)" />
  <div id="container"></div>

  <script>
    const width = window.innerWidth - 40;
    const height = 600;

    const stage = new Konva.Stage({ container: 'container', width, height });
    const layer = new Konva.Layer();
    stage.add(layer);

    const arrows = [];
    let selectedBox = null;

    function addBox(x = 50, y = 50, text = 'Caja') {
      const group = new Konva.Group({ x, y, draggable: true });

      const rect = new Konva.Rect({
        width: 120,
        height: 50,
        fill: '#89b717',
        stroke: 'black',
        strokeWidth: 2,
        cornerRadius: 8
      });

      const label = new Konva.Text({
        text,
        fontSize: 16,
        fill: 'white',
        align: 'center',
        verticalAlign: 'middle',
        width: 120,
        height: 50,
        padding: 10
      });

      group.add(rect);
      group.add(label);
      layer.add(group);
      layer.draw();

      group.on('dblclick', () => {
        const newText = prompt('Nuevo texto:', label.text());
        if (newText) {
          label.text(newText);
          layer.draw();
        }
      });

      group.on('click', () => {
        if (selectedBox && selectedBox !== group) {
          drawArrow(selectedBox, group);
          selectedBox = null;
        } else {
          selectedBox = group;
        }
      });

      group.on('dragmove', () => updateArrows());
    }

    function drawArrow(fromGroup, toGroup) {
      const arrow = new Konva.Arrow({
        points: getArrowPoints(fromGroup, toGroup),
        stroke: 'black',
        fill: 'black',
        pointerLength: 10,
        pointerWidth: 10,
        tension: 0,
      });
      arrow.from = fromGroup;
      arrow.to = toGroup;
      arrows.push(arrow);
      layer.add(arrow);
      layer.draw();
    }

    function getArrowPoints(fromGroup, toGroup) {
      const from = fromGroup.getClientRect();
      const to = toGroup.getClientRect();
      return [
        from.x + from.width / 2,
        from.y + from.height / 2,
        to.x + to.width / 2,
        to.y + to.height / 2
      ];
    }

    function updateArrows() {
      arrows.forEach(arrow => {
        arrow.points(getArrowPoints(arrow.from, arrow.to));
      });
      layer.batchDraw();
    }

    function exportJSON() {
      const boxes = [];
      const lines = arrows.map(arrow => ({
        from: layer.getChildren().indexOf(arrow.from),
        to: layer.getChildren().indexOf(arrow.to)
      }));

      layer.getChildren().forEach(group => {
        const [rect, text] = group.getChildren();
        if (text instanceof Konva.Text) {
          boxes.push({
            x: group.x(),
            y: group.y(),
            text: text.text()
          });
        }
      });

      const blob = new Blob([JSON.stringify({ boxes, lines }, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'diagrama.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          layer.destroyChildren();
          arrows.length = 0;

          const groups = data.boxes.map(box => {
            addBox(box.x, box.y, box.text);
            return layer.getChildren()[layer.getChildren().length - 1];
          });

          data.lines?.forEach(line => {
            drawArrow(groups[line.from], groups[line.to]);
          });

          layer.draw();
        } catch (e) {
          alert('Error al importar JSON.');
          console.error(e);
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
