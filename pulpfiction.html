<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Trivial Pulp Fiction 🎬</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: url('img/fondo_pulp.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    .contenedor {
      background-color: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 15px;
      max-width: 600px;
      margin: 0 auto;
    }
    .pregunta {
      font-size: 1.5em;
      margin-bottom: 15px;
    }
    .respuestas button {
      display: block;
      margin: 10px auto;
      padding: 10px 20px;
      background-color: #333;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .respuestas button:hover {
      background-color: #555;
    }
    #resultado {
      margin-top: 20px;
      font-weight: bold;
      font-size: 1.2em;
    }
    #barraTiempo {
      height: 10px;
      background-color: red;
      width: 100%;
      margin-bottom: 15px;
      transition: width 1s linear;
    }
    #final {
      font-size: 1.5em;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <h1>Trivial Pulp Fiction 🎬</h1>
    <div id="trivial">Cargando...</div>
  </div>

  <script>
    let preguntas = [];
    let usadas = [];
    let puntuacion = 0;
    let tiempoMaximo = 15;
    let intervalo;
    let tiempoRestante;

    async function cargarPreguntas() {
      const response = await fetch('preguntas_pulp.json');
      preguntas = await response.json();
      mostrarNuevaPregunta();
    }

    function mostrarNuevaPregunta() {
      if (usadas.length === preguntas.length) {
        document.getElementById('trivial').innerHTML =
          `<div id="final">🎉 ¡Has terminado!<br>✅ Puntuación: ${puntuacion}/${preguntas.length}</div>`;
        return;
      }

      let index;
      do {
        index = Math.floor(Math.random() * preguntas.length);
      } while (usadas.includes(index));
      usadas.push(index);

      const pregunta = preguntas[index];
      const div = document.getElementById("trivial");

      const respuestasHtml = pregunta.respuestas.map(r =>
        `<button onclick="comprobarRespuesta('${r}', '${pregunta.correcta}')">${r}</button>`).join("");

      div.innerHTML = `
        <div class="pregunta">${pregunta.pregunta}</div>
        <div id="barraTiempo"></div>
        <div class="respuestas">${respuestasHtml}</div>
        <div id="resultado"></div>
      `;

      iniciarTemporizador();
    }

    function comprobarRespuesta(respuesta, correcta) {
      clearInterval(intervalo);
      const resultado = document.getElementById("resultado");
      if (respuesta === correcta) {
        resultado.textContent = "✅ ¡Correcto!";
        puntuacion++;
      } else {
        resultado.textContent = `❌ Incorrecto. Era: ${correcta}`;
      }
      setTimeout(mostrarNuevaPregunta, 3000);
    }

    function iniciarTemporizador() {
      tiempoRestante = tiempoMaximo;
      const barra = document.getElementById("barraTiempo");
      barra.style.width = "100%";
      intervalo = setInterval(() => {
        tiempoRestante--;
        barra.style.width = (tiempoRestante / tiempoMaximo * 100) + "%";
        if (tiempoRestante <= 0) {
          clearInterval(intervalo);
          document.getElementById("resultado").textContent = "⏰ Tiempo agotado.";
          setTimeout(mostrarNuevaPregunta, 3000);
        }
      }, 1000);
    }

    cargarPreguntas();
  </script>
</body>
</html>
