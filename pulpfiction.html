<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trivial Pulp Fiction 🎬</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #111;
      color: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin: 20px;
      color: #ffc107;
    }

    #trivial {
      max-width: 600px;
      background: #222;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px #000;
    }

    .pregunta {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    .respuestas button {
      display: block;
      width: 100%;
      margin: 5px 0;
      padding: 10px;
      font-size: 1rem;
      background: #333;
      color: #fff;
      border: 1px solid #444;
      border-radius: 5px;
      cursor: pointer;
    }

    .respuestas button:hover {
      background: #444;
    }

    #resultado {
      margin-top: 20px;
      font-size: 1.2rem;
    }

    #barraTiempo {
      height: 10px;
      background: #ffc107;
      margin: 10px 0;
      border-radius: 5px;
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>
  <h1>Trivial Pulp Fiction 🎬</h1>
  <div id="trivial">Cargando...</div>

  <script>
    let preguntas = [];
    let usadas = [];
    let preguntaActual = null;
    let timer = null;
    let tiempoMax = 5000; // 5 segundos

    async function cargarPreguntas() {
      const res = await fetch("preguntas.json");
      preguntas = await res.json();
      siguientePregunta();
    }

    function siguientePregunta() {
      if (usadas.length === preguntas.length) {
        document.getElementById("trivial").innerHTML = `<h2>Juego terminado</h2><p>¡Has respondido todas las preguntas!</p>`;
        return;
      }

      do {
        preguntaActual = preguntas[Math.floor(Math.random() * preguntas.length)];
      } while (usadas.includes(preguntaActual));

      usadas.push(preguntaActual);

      mostrarPregunta(preguntaActual);
    }

    function mostrarPregunta(pregunta) {
      const div = document.getElementById("trivial");
      let respuestasHtml = pregunta.respuestas.map((r, i) => `<button onclick="comprobarRespuesta('${r}')">${r}</button>`).join("");

      div.innerHTML = `
        <div class="pregunta">${pregunta.pregunta}</div>
        <div id="barraTiempo"></div>
        <div class="respuestas">${respuestasHtml}</div>
        <div id="resultado"></div>
      `;

      iniciarTemporizador();
    }

    function comprobarRespuesta(respuesta) {
      detenerTemporizador();

      const resultado = document.getElementById("resultado");
      if (respuesta === preguntaActual.correcta) {
        resultado.innerHTML = "✅ ¡Correcto!";
      } else {
        resultado.innerHTML = `❌ Incorrecto. Era: ${preguntaActual.correcta}`;
      }

      setTimeout(siguientePregunta, 1500);
    }

    function iniciarTemporizador() {
      const barra = document.getElementById("barraTiempo");
      let tiempoRestante = tiempoMax;
      barra.style.width = "100%";

      timer = setInterval(() => {
        tiempoRestante -= 100;
        barra.style.width = `${(tiempoRestante / tiempoMax) * 100}%`;

        if (tiempoRestante <= 0) {
          clearInterval(timer);
          comprobarRespuesta("Tiempo agotado");
        }
      }, 100);
    }

    function detenerTemporizador() {
      clearInterval(timer);
    }

    cargarPreguntas();
  </script>
</body>
</html>
