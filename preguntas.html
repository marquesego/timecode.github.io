<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Academia Historia PRO</title>

<style>
body {
  font-family: Arial;
  background: #f5f7fa;
  text-align: center;
}

.container {
  background: white;
  width: 70%;
  margin: 30px auto;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 0 15px rgba(0,0,0,0.2);
}

button {
  display: block;
  margin: 10px auto;
  padding: 12px;
  width: 80%;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.correct { background: #2ecc71; color: white; }
.wrong { background: #e74c3c; color: white; }

.bar {
  background: #ddd;
  height: 20px;
  border-radius: 10px;
}

.progress {
  height: 20px;
  background: #3498db;
  border-radius: 10px;
  width: 0%;
}
</style>
</head>

<body>

<div class="container">
<h2>🎓 Academia Historia PRO</h2>

<div class="bar"><div id="progress" class="progress"></div></div>

<h3 id="question"></h3>
<div id="answers"></div>

<p id="feedback"></p>
<p id="score"></p>

<button onclick="restart()">Reiniciar</button>
<button onclick="reviewErrors()">Repasar errores</button>

</div>

<script>

let quiz = [];
let index = 0;
let score = 0;
let errors = [];
let modeErrors = false;

// ✅ Cargar JSON
fetch("preguntas.json")
.then(res => res.json())
.then(data => {
  quiz = data;
  loadQuestion();
});

function loadQuestion() {

  if(index >= quiz.length){
    document.getElementById("question").innerText = "FIN DEL EXAMEN";
    document.getElementById("answers").innerHTML = "";
    document.getElementById("score").innerText =
      "Nota: " + Math.round(score/quiz.length*10) + "/10";
    return;
  }

  let q = quiz[index];

  document.getElementById("question").innerText = q.q;
  document.getElementById("progress").style.width =
    (index / quiz.length * 100) + "%";

  let html = "";

  q.options.forEach((opt,i)=>{
    html += `<button onclick="check(${i}, this)">${opt}</button>`;
  });

  document.getElementById("answers").innerHTML = html;
  document.getElementById("feedback").innerText = "";
}

function check(i,btn){

  let q = quiz[index];

  if(i === q.correct){
    btn.classList.add("correct");
    score++;
  } else {
    btn.classList.add("wrong");
    errors.push(q);
  }

  setTimeout(()=>{
    index++;
    loadQuestion();
  }, 800);
}

function restart(){
  index = 0;
  score = 0;
  errors = [];
  modeErrors = false;
  loadQuestion();
}

function reviewErrors(){
  if(errors.length === 0) return;

  quiz = errors;
  index = 0;
  score = 0;
  errors = [];
  modeErrors = true;
  loadQuestion();
}

</script>

</body>
</html>
